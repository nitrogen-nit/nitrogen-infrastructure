name: nitrogen-observability

services:
  prometheus:
    image: ${NITROGEN_PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${NITROGEN_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${NITROGEN_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability

  grafana:
    image: ${NITROGEN_GRAFANA_IMAGE:-grafana/grafana:13.0.7-slim}
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${NITROGEN_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${NITROGEN_GRAFANA_ADMIN_PASSWORD:-nitrogen-local}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:${NITROGEN_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability

  loki:
    image: ${NITROGEN_LOKI_IMAGE:-grafana/loki:3.7.6}
    profiles: ["observability"]
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      NITROGEN_LOKI_RETENTION: ${NITROGEN_LOKI_RETENTION:-168h}
    ports:
      - "127.0.0.1:${NITROGEN_LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - observability

  tempo:
    image: ${NITROGEN_TEMPO_IMAGE:-grafana/tempo:2.10.7}
    profiles: ["observability"]
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -config.expand-env=true
    environment:
      NITROGEN_TEMPO_RETENTION: ${NITROGEN_TEMPO_RETENTION:-72h}
    ports:
      - "127.0.0.1:${NITROGEN_TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  otel-collector:
    image: ${NITROGEN_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.153.0}
    profiles: ["observability"]
    command:
      - --config=/etc/otelcol-contrib/config.yml
    ports:
      - "127.0.0.1:${NITROGEN_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${NITROGEN_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${NITROGEN_OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - tempo
    volumes:
      - ./observability/otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    networks:
      - observability

  alloy:
    image: ${NITROGEN_ALLOY_IMAGE:-grafana/alloy:v1.19.2}
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${NITROGEN_ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:

networks:
  observability:
    driver: bridge
