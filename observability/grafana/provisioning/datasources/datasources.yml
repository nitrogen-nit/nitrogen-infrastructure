apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherRegex: "\"traceId\":\"([A-Fa-f0-9]+)\""
          datasourceUid: tempo
          url: "$${__value.raw}"
        - name: correlationId
          matcherRegex: "\"correlationId\":\"([A-Za-z0-9._:-]+)\""

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
          - key: deployment.environment.name
            value: environment
      search:
        hide: false
      nodeGraph:
        enabled: true
